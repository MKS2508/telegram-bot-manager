# Workflow para construir y desplegar la documentación a GitHub Pages
name: Deploy Docs to Pages

on:
  push:
    branches: ["master"]
    paths:
      - 'apps/telegram-bot-manager-docs/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/telegram-bot-manager-docs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build with Next.js
        run: bun run build
        env:
          NODE_ENV: production

      - name: Move files for basePath
        run: |
          cd out
          mkdir telegram-bot-manager
          # Move all files and directories except telegram-bot-manager itself
          for item in *; do
            if [ "$item" != "telegram-bot-manager" ]; then
              mv "$item" telegram-bot-manager/
            fi
          done
          # Also move hidden files if any
          for item in .[^.]*; do
            if [ -e "$item" ] && [ "$item" != "." ] && [ "$item" != ".." ] && [ "$item" != ".git" ]; then
              mv "$item" telegram-bot-manager/
            fi
          done

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/telegram-bot-manager-docs/out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
